name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run JUnit tests
        run: ./mvnw -B -Dtest='*Test,*Tests,*TestCase' test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run smoke stories
        run: ./mvnw -B -Dtest=SmokeStoryRunner test

  component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run component stories
        run: ./mvnw -B -Dtest=ComponentStoryRunner test

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run regression stories
        run: ./mvnw -B -Dtest=RegressionStoryRunner test

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run integration stories
        run: ./mvnw -B -Dtest=IntegrationStoryRunner test
