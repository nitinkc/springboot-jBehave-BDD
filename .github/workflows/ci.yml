name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run JUnit tests
        run: ./mvnw -B -Dtest='*Test,*Tests,*TestCase' test

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run smoke stories
        run: ./mvnw -B -Dtest=SmokeStoryRunner test

      - name: Upload smoke jBehave reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-jbehave-reports
          path: target/jbehave/**

  component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run component stories
        run: ./mvnw -B -Dtest=ComponentStoryRunner test

      - name: Upload component jBehave reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-jbehave-reports
          path: target/jbehave/**

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run regression stories
        run: ./mvnw -B -Dtest=RegressionStoryRunner test

      - name: Upload regression jBehave reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-jbehave-reports
          path: target/jbehave/**

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run integration stories
        run: ./mvnw -B -Dtest=IntegrationStoryRunner test

      - name: Upload integration jBehave reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-jbehave-reports
          path: target/jbehave/**

  publish-reports:
    runs-on: ubuntu-latest
    needs: [smoke, component, regression, integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download jBehave artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Pages content
        run: |
          mkdir -p public
          for dir in artifacts/*-jbehave-reports; do
            name=$(basename "$dir")
            suite=${name%-jbehave-reports}
            mkdir -p "public/$suite"
            cp -R "$dir"/* "public/$suite"/
          done

          build_time_utc=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          build_time_seattle=$(TZ=America/Los_Angeles date +"%Y-%m-%d %H:%M:%S %Z")
          build_time_bangalore=$(TZ=Asia/Kolkata date +"%Y-%m-%d %H:%M:%S %Z")

          cat > public/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>jBehave Reports</title>
            </head>
            <body>
              <h1>jBehave Reports</h1>
              <p>Built (UTC): ${build_time_utc}</p>
              <p>Built (Seattle): ${build_time_seattle}</p>
              <p>Built (Bangalore): ${build_time_bangalore}</p>
              <ul>
                <li><a href="smoke/view/index.html">Smoke</a></li>
                <li><a href="component/view/index.html">Component</a></li>
                <li><a href="regression/view/index.html">Regression</a></li>
                <li><a href="integration/view/index.html">Integration</a></li>
              </ul>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    runs-on: ubuntu-latest
    needs: publish-reports
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
